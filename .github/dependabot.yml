version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript:
        patterns:
          - 'typescript'
          - '@typescript-eslint/*'
      tooling:
        patterns:
          - 'eslint*'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
