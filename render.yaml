# The Render blueprint for the single-service deploy: one Docker web service
# that serves the API, the interface and the audits.
#
# It defaults to Render's free plan, so applying it needs no payment method.
# Free is a trial shape, from Render's own docs: 0.1 CPU / 512 MB, a spin-down
# after fifteen idle minutes with a slow wake, and a filesystem that resets on
# every deploy, restart and spin-down — the database does not survive any of
# them, and there is no shell or disk to retrieve it. That is fine for walking
# the whole app; for leads that persist, switch `plan` and uncomment the disk
# at the bottom. docs/DEPLOY.md says the same in more words.
#
# The service is public: ALLOW_PUBLIC_ACCESS=true, no sign-in. To gate it
# instead, swap that entry for an AUTH_TOKEN (generateValue: true) — a deploy
# is gated or public, and both at once is refused.
#
# Setup: push this repository to a Git host, then in Render choose
# Blueprints -> New Blueprint Instance and pick the repository. The values
# marked `sync: false` are asked for once; everything else is a default that
# matches the app's design.

services:
  - type: web
    name: localscout
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore # Closest Render region to India; change to suit.
    # free needs no card. 0.5c-512mb is the smallest paid size where
    # Lighthouse is usable, 1c-2g is the fast one; both paid sizes expect the
    # disk below, and free cannot have one.
    plan: free
    # Deploy on every push to the connected branch. `checksPass` is the other
    # honest option once the host runs this repo's CI; `off` deploys only from
    # the dashboard button.
    autoDeployTrigger: commit
    # Exempt from the token on purpose: a platform health check cannot sign in.
    healthCheckPath: /api/health
    envVars:
      # No sign-in: anyone who can reach the URL can use the app. Suits a
      # fixtures-mode demo; swap this entry for
      #   - key: AUTH_TOKEN
      #     generateValue: true
      # to gate it instead. AUTH_TOKEN gates every route and asks the browser
      # once per device (any username, the token as the password).
      - key: ALLOW_PUBLIC_ACCESS
        value: 'true'
      # The app's writable directory. With a disk attached it is the mount;
      # without one it is the container's own storage, recreated empty
      # whenever the instance is replaced.
      - key: DATA_DIR
        value: /var/data
      - key: SERPAPI_CACHE_DIR
        value: /var/data/cache/serpapi
      # The port Render routes to; the image defaults to the same value.
      - key: PORT
        value: '10000'
      # Start in fixtures mode: no keys, no cost, the whole pipeline walkable.
      - key: DISCOVERY_MODE
        value: fixtures
      - key: LLM_PROVIDER
        value: fixture
      # Flat and predictable wherever the CPU is small; raise it on a larger
      # plan.
      - key: AUDIT_CONCURRENCY
        value: '1'
      # Asked for on first deploy, blank is a supported state (the Settings
      # screen says what is missing and what it changes). To draft with a
      # hosted model, also set LLM_PROVIDER=openai-compatible, LLM_BASE_URL,
      # LLM_MODEL and LLM_API_KEY in the dashboard.
      - key: SERPAPI_API_KEY
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: SENDER_PORTFOLIO_URL
        sync: false
    # Uncomment for a database that survives deploys, and set `plan` to a paid
    # size above. A disk needs a paid plan and pins the service to one
    # instance, which is the correct shape: runs live in the process that
    # started them and SQLite is a single writer.
    # disk:
    #   name: localscout-data
    #   mountPath: /var/data
    #   sizeGB: 1
